name: Deploy Model Editor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/viewer/**'
      - 'src/web/**'
      - 'src/levels/**'
      - 'src/build_levels.py'
      - 'src/level_rnc*.py'
      - 'src/build_viewer.py'
      - 'tests/**'
      - 'src/check.py'
      - 'tools/**'
      - 'core/**'
      - 'core.lock'
      - 'NOTICE.md'
      - '.github/workflows/parts-lab-pages.yml'
permissions:
  contents: read
concurrency:
  group: parts-lab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python src/check.py
      # Fetches Pyodide, EmulatorJS and the N64 cores at pinned versions, verifies SHA-256 and licenses, places them in site/dist/vendor.
      - run: python src/build_viewer.py --public
      - run: python tools/vendor_deps.py --out site/dist --offline
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
