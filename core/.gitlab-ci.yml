# GitLab Pages: publish only when a release tag is pushed. The build is one stdlib-only Python command.
pages:
  image: python:3.12-slim
  script:
    - python src/build_site.py --pack packs/sample --out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
